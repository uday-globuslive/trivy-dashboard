# Nginx configuration for Trivy Dashboard as subdomain
# trivy.hostname.mycompany.com -> http://10.11.53.8:5001

# ==============================================================================
# Create this as a NEW server block (separate from your Jenkins server block)
# Trivy Dashboard is running on: 10.11.53.8:5001
# ==============================================================================

server {
    listen 80;
    server_name trivy.hostname.mycompany.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name trivy.hostname.mycompany.com;
    
    # SSL certificates - use the same as your Jenkins or get a new one
    # Option 1: Use wildcard cert if you have one for *.hostname.mycompany.com
    # Option 2: Use the same cert if it covers both domains
    # Option 3: Get a new cert with certbot: certbot --nginx -d trivy.hostname.mycompany.com
    ssl_certificate /etc/letsencrypt/live/hostname.mycompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostname.mycompany.com/privkey.pem;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    location / {
        proxy_pass http://10.11.53.8:5001;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
