name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: trivy-security-dashboard

jobs:
  # Scan repository code and filesystem for vulnerabilities
  filesystem-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read  # required for private repositories
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        scanners: 'vuln,secret,misconfig'

    - name: Upload filesystem scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'

    - name: Generate filesystem scan JSON report
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'json'
        output: 'trivy-fs-results.json'
        severity: 'CRITICAL,HIGH,MEDIUM'
        scanners: 'vuln,secret,misconfig'

    - name: Upload filesystem scan artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: filesystem-scan-results
        path: |
          trivy-fs-results.sarif
          trivy-fs-results.json
        retention-days: 30

  build-and-push:
    runs-on: ubuntu-latest
    needs: filesystem-scan
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read  # required for private repositories

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Trivy Security Dashboard
          org.opencontainers.image.description=Flask-based dashboard for visualizing Trivy security scan results from native Trivy JSON reports in Nexus Repository
          org.opencontainers.image.vendor=Security Team
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.url=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created={{date 'YYYY-MM-DD[T]HH:MM:SS[Z]'}}
          maintainer=Trivy Security Dashboard Team

    # Build image locally first for scanning
    - name: Build Docker image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        file
